name: Isolation wrapper

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-wrapper-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n scripts/run_isolated.sh
      - name: Required Docker isolation envelope
        run: python3 tests/test_run_isolated.py
      - name: Python test suite
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  # The static job above validates the wrapper's argv construction with a fake Docker; it cannot
  # tell whether a submission is ACTUALLY sandboxed (a daemon silently ignoring --pids-limit, a
  # runner defaulting to --privileged, or a broken image would all pass). This required job builds
  # the real image (whose Dockerfile runs the full harness) and asserts the envelope empirically.
  real-container-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build evaluation image
        # The in-build green gate uses the Dockerfile's single worker setting
        # (HARNESS_JOBS=2): a serial gate no longer fits the 90-minute job
        # budget, and four workers exceeded the hosted runner's 16 GiB (the
        # heaviest cases peak at 2.3-4.9 GiB each; the agent shut down mid-gate
        # with exit 143). Two workers keep the worst pair near 8 GiB, and CI
        # builds exactly what a deployment build does. This development harness
        # validates the manifest; the bounded canary below separately checks
        # container memory enforcement and OOM attribution.
        run: docker build -t lean-kernel-judge .
      - name: Network must be unreachable (IPv4 and IPv6, fail-closed)
        run: |
          # Reuse the judge's own probe so CI and the judge cannot drift, and so this test
          # inherits its fail-closed semantics: only an explicit no-route errno counts as
          # isolation; ECONNREFUSED (something answered) or a timeout counts as reachable.
          docker run --rm --network none --user judge lean-kernel-judge \
            python3 -c "
          import sys
          sys.path.insert(0, 'judge')
          import judge
          if judge._network_is_reachable():
              print('FAIL: network reachable under --network none'); sys.exit(1)
          print('ok: network unreachable (v4+v6)')
          "

      - name: Control — the same probe reports reachable WITHOUT --network none
        run: |
          # If the probe always returned False the test above would pass vacuously.
          docker run --rm --user judge lean-kernel-judge \
            python3 -c "
          import sys
          sys.path.insert(0, 'judge')
          import judge
          if not judge._network_is_reachable():
              print('FAIL: probe reports isolated on a networked container'); sys.exit(1)
          print('ok: probe detects a working network')
          "
      - name: PID limit must be enforced (fork bomb is contained)
        run: |
          docker run --rm --network none --pids-limit 64 --user judge lean-kernel-judge \
            python3 -c "
          import os, sys
          children = 0
          try:
              for _ in range(500):
                  if os.fork() == 0: os._exit(0)
                  children += 1
          except OSError:
              print(f'ok: fork refused after {children} children'); sys.exit(0)
          print(f'FAIL: forked {children} children with --pids-limit 64'); sys.exit(1)
          "
      - name: Resolve the official test problem's memory policy
        run: echo "LKC_CI_MEMORY=$(python3 scripts/memory_policy.py evaluation/problems/fib/config.json)" >> "$GITHUB_ENV"
      - name: Prepare reference answers for the official entry tests
        run: |
          # This public CI seed is test data. Prepare with the same image as the
          # judge; deliver the bundle over stdin, never a contestant-visible mount.
          printf 'ci-secret-seed\n' | docker run --rm --interactive --network none \
            --user judge lean-kernel-judge bash -euc '
              python3 scripts/prepare_reference.py --problem fib --official \
                --output /tmp/ci-reference.json >&2
              cat /tmp/ci-reference.json
            ' > "$RUNNER_TEMP/lkc-ci-reference.json"

      - name: Per-problem memory caps contain OOM and preserve attribution
        run: |
          # A bounded canary proves both failure and success for the same allocation.
          # At most 192 MiB is available to either container; this cannot exhaust the host.
          for memory_mb in 64 192; do
            docker run --rm --network none --user judge --pids-limit 64 \
              --memory "${memory_mb}m" --memory-swap "${memory_mb}m" \
              -e EVALUATION_MEMORY="${memory_mb}m" \
              -e ISOLATION_ATTESTATION=run_isolated.sh lean-kernel-judge python3 -c '
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "judge")
          import judge
          limit = judge._memory_mb_from_envelope(os.environ["EVALUATION_MEMORY"])
          judge._validate_official_memory({"evaluation": {"memory_mb": limit}})
          rc, output = judge.run(
              [sys.executable, "-c", "data = bytearray(128 * 1024 * 1024)"],
              Path.cwd(), os.environ.copy(), 30)
          exhausted = judge._attested_local_memory_kill(rc)
          if limit == 64:
              assert exhausted, (rc, output)
              record = judge._resource_limit_measurement(None, "local-container-cgroup", "build-export")
              assert record["memory_mb"] == limit, record
          else:
              assert rc == 0 and not exhausted, (rc, output)
          print(f"ok: {limit} MiB policy enforced; OOM attribution={exhausted}")
          '
          done

      - name: Judge refuses an official run without the wrapper attestation
        run: |
          # Supply the seed, reference answers, cohort, and resource envelope so the run can only
          # fail on the missing attestation — otherwise this test passes for the wrong reason and
          # would keep passing even if the attestation check were deleted.
          image_id="$(docker image inspect --format '{{.Id}}' lean-kernel-judge)"
          set +e
          out=$({ printf 'ci-secret-seed\n'; cat "$RUNNER_TEMP/lkc-ci-reference.json"; } | \
                docker run --rm --interactive --network none \
                  --memory "$LKC_CI_MEMORY" --memory-swap "$LKC_CI_MEMORY" --cpus 2 --pids-limit 512 \
                  --user judge -e OFFICIAL_EVAL=1 -e PERF_SEED_STDIN=1 \
                  -e REFERENCE_ANSWERS_STDIN=1 -e EVALUATION_MEMORY="$LKC_CI_MEMORY" \
                  -e EVALUATION_CPUS=2 -e EVALUATION_PIDS_LIMIT=512 \
                  -e EVALUATION_COHORT=ci-cohort -e EVALUATION_RUN_ID=ci-missing-attest \
                  -e EVALUATION_IMAGE="$image_id" -e EVALUATION_EXECUTOR_ID=ci-pmu \
                  -e EVALUATION_EXECUTOR_VERSION=ci-pmu-v1 \
                  -e TIMING_METRIC=perf_instructions lean-kernel-judge \
                  python3 judge/judge.py run --problem fib \
                  --submission examples/submissions/fib/baseline --tag ci-attest --reps 3 2>&1)
          status=$?
          set -e
          echo "$out"
          if [ "$status" -eq 0 ]; then
            echo "FAIL: official run accepted without attestation"; exit 1
          fi
          # Assert the SPECIFIC reason, not merely that it failed.
          echo "$out" | grep -q "ISOLATION_ATTESTATION" || {
            echo "FAIL: refused for an unrelated reason, not the missing attestation"; exit 1; }
          echo "ok: refused specifically for the missing attestation"

      - name: Sanity — the attested official path reaches judging
        run: |
          # Guards against the attestation check being trivially unsatisfiable (which would make
          # the negative test above pass vacuously). Use an intentionally invalid submission so
          # this proves the official path reached the correctness gate without requiring PMU
          # access from the hosted runner.
          image_id="$(docker image inspect --format '{{.Id}}' lean-kernel-judge)"
          out=$({ printf 'ci-secret-seed\n'; cat "$RUNNER_TEMP/lkc-ci-reference.json"; } | \
            docker run --rm --interactive --network none \
            --memory "$LKC_CI_MEMORY" --memory-swap "$LKC_CI_MEMORY" --cpus 2 --pids-limit 512 \
            --user judge -e OFFICIAL_EVAL=1 -e PERF_SEED_STDIN=1 \
            -e REFERENCE_ANSWERS_STDIN=1 -e EVALUATION_MEMORY="$LKC_CI_MEMORY" \
            -e EVALUATION_CPUS=2 -e EVALUATION_PIDS_LIMIT=512 \
            -e EVALUATION_COHORT=ci-cohort -e EVALUATION_RUN_ID=ci-attest-ok \
            -e EVALUATION_IMAGE="$image_id" -e EVALUATION_EXECUTOR_ID=ci-pmu \
            -e EVALUATION_EXECUTOR_VERSION=ci-pmu-v1 \
            -e ISOLATION_ATTESTATION=run_isolated.sh -e TIMING_METRIC=perf_instructions \
            lean-kernel-judge python3 judge/judge.py run --problem fib \
            --submission examples/submissions/fib/cheat-sorry --tag ci-attest-ok --reps 3)
          echo "$out"
          echo "$out" | grep -q "fib/ci-attest-ok: rejected" || {
            echo "FAIL: attested invalid submission did not reach a judged rejection"; exit 1; }
          echo "ok: attested official path reached the correctness gate"
