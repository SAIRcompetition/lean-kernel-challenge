name: Isolation wrapper

on:
  pull_request:
  push:
  workflow_dispatch:      # for the real-container job below

permissions:
  contents: read

jobs:
  static-wrapper-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n scripts/run_isolated.sh
      - name: Required Docker isolation envelope
        run: python3 tests/test_run_isolated.py
      - name: Judge logic, scoring, and reporting/contract suites
        run: |
          python3 tests/test_judge_logic.py
          python3 tests/test_scoring.py
          python3 tests/test_reporting_and_contract.py

  # The static job above validates the wrapper's argv construction with a fake Docker; it cannot
  # tell whether a submission is ACTUALLY sandboxed (a daemon silently ignoring --pids-limit, a
  # runner defaulting to --privileged, or a broken image would all pass). This job builds the real
  # image and asserts the envelope empirically. It is workflow_dispatch-only because the image
  # build is slow; run it before launch and after any Dockerfile/wrapper change.
  real-container-isolation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build evaluation image
        run: docker build -t lean-kernel-judge .
      - name: Network must be unreachable (IPv4 and IPv6, fail-closed)
        run: |
          # Reuse the judge's own probe so CI and the judge cannot drift, and so this test
          # inherits its fail-closed semantics: only an explicit no-route errno counts as
          # isolation; ECONNREFUSED (something answered) or a timeout counts as reachable.
          docker run --rm --network none --user judge lean-kernel-judge \
            python3 -c "
          import sys
          sys.path.insert(0, 'judge')
          import judge
          if judge._network_is_reachable():
              print('FAIL: network reachable under --network none'); sys.exit(1)
          print('ok: network unreachable (v4+v6)')
          "

      - name: Control — the same probe reports reachable WITHOUT --network none
        run: |
          # If the probe always returned False the test above would pass vacuously.
          docker run --rm --user judge lean-kernel-judge \
            python3 -c "
          import sys
          sys.path.insert(0, 'judge')
          import judge
          if not judge._network_is_reachable():
              print('FAIL: probe reports isolated on a networked container'); sys.exit(1)
          print('ok: probe detects a working network')
          "
      - name: PID limit must be enforced (fork bomb is contained)
        run: |
          docker run --rm --network none --pids-limit 64 --user judge lean-kernel-judge \
            python3 -c "
          import os, sys
          children = 0
          try:
              for _ in range(500):
                  if os.fork() == 0: os._exit(0)
                  children += 1
          except OSError:
              print(f'ok: fork refused after {children} children'); sys.exit(0)
          print(f'FAIL: forked {children} children with --pids-limit 64'); sys.exit(1)
          "
      - name: Judge refuses an official run without the wrapper attestation
        run: |
          # Supply EVERY other official precondition (seed on stdin, cohort) so the run can only
          # fail on the missing attestation — otherwise this test passes for the wrong reason and
          # would keep passing even if the attestation check were deleted.
          set +e
          out=$(printf 'ci-secret-seed\n' | docker run --rm --interactive --network none \
                  --user judge -e OFFICIAL_EVAL=1 -e PERF_SEED_STDIN=1 \
                  -e EVALUATION_COHORT=ci-cohort lean-kernel-judge \
                  python3 judge/judge.py run --problem fib \
                  --submission examples/submissions/fib/baseline --tag ci-attest --reps 1 2>&1)
          status=$?
          set -e
          echo "$out"
          if [ "$status" -eq 0 ]; then
            echo "FAIL: official run accepted without attestation"; exit 1
          fi
          # Assert the SPECIFIC reason, not merely that it failed.
          echo "$out" | grep -q "ISOLATION_ATTESTATION" || {
            echo "FAIL: refused for an unrelated reason, not the missing attestation"; exit 1; }
          echo "ok: refused specifically for the missing attestation"

      - name: Sanity — the same run succeeds once the wrapper attestation is present
        run: |
          # Guards against the attestation check being trivially unsatisfiable (which would make
          # the negative test above pass vacuously).
          printf 'ci-secret-seed\n' | docker run --rm --interactive --network none \
            --user judge -e OFFICIAL_EVAL=1 -e PERF_SEED_STDIN=1 \
            -e EVALUATION_COHORT=ci-cohort -e ISOLATION_ATTESTATION=run_isolated.sh \
            lean-kernel-judge python3 judge/judge.py run --problem fib \
            --submission examples/submissions/fib/baseline --tag ci-attest-ok --reps 1
          echo "ok: accepted with attestation"
